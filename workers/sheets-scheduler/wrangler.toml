name = "chessunited-sheets-scheduler"
main = "index.js"
compatibility_date = "2026-11-07"
workers_dev = false
preview_urls = false

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "chess-united"
database_id = "41d6bcc5-6c5b-44a9-9e4b-3008f5861560"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
