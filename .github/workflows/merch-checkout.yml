name: Merchandise checkout tests

on:
  push:
    branches:
      - fix/merch-checkout-2026-11-07
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:shipping
      - run: npm run build
      - name: Check Cloudflare release credential availability
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare deploy credentials are available."
          else
            echo "Cloudflare deploy credentials are not configured in GitHub Actions."
          fi
