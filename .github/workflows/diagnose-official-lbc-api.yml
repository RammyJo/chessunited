name: Inspect official LBC rate calculator public API
on:
  push:
    branches: [feature/courier-service-1kg-2026-11-07]
    paths: [.github/workflows/diagnose-official-lbc-api.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover documented public LBC API request formats
        run: |
          node --input-type=module <<'NODE'
          const root='https://ratecalcapi.lbcapps.com';
          async function get(u){const r=await fetch(u,{signal:AbortSignal.timeout(16000)});const b=await r.text();return {status:r.status,text:b,contentType:r.headers.get('content-type')};}
          for(const page of ['/Tools/PH_Rate_Calculator','/Help','/Help/Api/POST-api-PH-GetProducts','/Help/Api/POST-api-PH-CalculatePrice','/Help/Api/POST-api-PH-GetProductsV2','/Help/Api/POST-api-PH-CalculatePriceV2']){
           try{
            const r=await get(root+page);
            console.log('LBC_PAGE',JSON.stringify({page,status:r.status,len:r.text.length,body:r.text.slice(0,220)}));
            if(page==='/Tools/PH_Rate_Calculator'){
             const scripts=[...r.text.matchAll(/<script[^>]*src=["']([^"']+)["']/gi)].map(x=>x[1]);
             console.log('LBC_SCRIPTS',JSON.stringify(scripts));
             const inline=r.text.replace(/<script[^>]*src=["'][^"']+["'][^>]*>[\s\S]*?<\/script>/gi,'');
             for(const match of [...inline.matchAll(/.{0,230}(?:\/api\/PH\/|\/api\/ph\/|CalculatePrice|GetProducts|GetRegions|GetCities).{0,550}/gi)].slice(0,18))console.log('INLINE_API',match[0].slice(0,750));
             for(const src of scripts.filter(x=>!x.includes('jquery')&&!x.includes('bootstrap')&&!x.includes('modernizr')&&!x.includes('respond'))){
              try{const url=new URL(src,root+page);if(url.origin!==root)continue;const f=await get(url.href);console.log('SCRIPT_INFO',JSON.stringify({src,len:f.text.length,status:f.status}));for(const m of [...f.text.matchAll(/.{0,280}(?:\/api\/PH\/|\/api\/ph\/|CalculatePrice|GetProducts|GetRegions|GetCities).{0,480}/gi)].slice(0,24))console.log('SCRIPT_API',url.pathname,m[0].slice(0,800))}catch(e){console.log('SCRIPT_ERR',src,String(e).slice(0,110))}
             }
            }
           }catch(e){console.log('LBC_ERR',page,String(e).slice(0,220))}
          }
          NODE
