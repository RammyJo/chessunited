name: Inspect LBC public request shapes
on:
  push:
    branches: [feature/courier-service-1kg-2026-11-07]
    paths: [.github/workflows/inspect-lbc-request-shapes.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read official LBC rate calculator client (public JavaScript)
        run: |
          node --input-type=module <<'NODE'
          const root='https://ratecalcapi.lbcapps.com';
          const js=await (await fetch(root+'/Scripts/PH_Rate_Calculator.js')).text();
          const rows=js.split(/\r?\n/);
          console.log('LBC_SCRIPT_LINES',rows.length);
          for(let i=0;i<rows.length;i++) {
            if(/api\/PH\/|data:|JSON.stringify|success:|method:|type:|GetProducts|CalculatePrice|GetCities|GetRegions|weight|declared/i.test(rows[i])) {
              const start=Math.max(0,i-3),end=Math.min(rows.length,i+12);
              console.log('LBC_JS_CONTEXT',JSON.stringify({line:i+1,text:rows.slice(start,end).map((s,k)=>String(start+k+1).padStart(3,'0')+' '+s).join('\n').slice(0,2100)}))
            }
          }
          NODE
