name: Diagnose J&T routes and Safari-style checkout
on:
  push:
    branches: [diagnose/checkout-browser-jt-2026-11-07]
    paths: [.github/workflows/diagnose-webkit-routes.yml]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps webkit
      - name: Test multiple J&T routes and WebKit payment button
        run: |
          node --input-type=module <<'NODE'
          import {webkit} from 'playwright';
          const base='https://chessunitedglobal.com';
          const loc=await (await fetch(base+'/data/shipping-locations.json')).json();
          const regions=['LA-UNION','METRO-MANILA','CEBU','DAVAO-DEL-SUR','PALAWAN'];
          for(const province of regions){
            const x=loc.jt.find(x=>x.province===province);if(!x){console.log('J&T PROVINCE NOT FOUND',province);continue;}
            const start=Date.now();
            try{
              const r=await fetch(base+'/api/shipping/quote',{method:'POST',headers:{'content-type':'application/json',Origin:base},body:JSON.stringify({courier:'jt',destinationId:x.id,items:[{id:'cap',qty:1}]}),signal:AbortSignal.timeout(26000)});
              const d=await r.json();console.log('ROUTE',JSON.stringify({province,city:x.city,http:r.status,ms:Date.now()-start,fee:d.quote?.shippingFee,error:d.error}));
            }catch(e){console.log('ROUTE_ERR',province,String(e).slice(0,150))}
          }
          const browser=await webkit.launch();
          try{
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            page.on('pageerror',e=>console.log('WEBKIT_ERROR',e.message));
            page.on('response',async r=>{if(new URL(r.url()).pathname==='/api/shipping/quote'){const d=await r.json().catch(()=>({}));console.log('WEBKIT_API',JSON.stringify({status:r.status(),fee:d.quote?.shippingFee,error:d.error,request:JSON.parse(r.request().postData()||'{}').courier}))}});
            await page.goto(base+'/shop/',{waitUntil:'domcontentloaded'});
            await page.locator('[data-add-to-cart="cap"]').click();await page.locator('[data-cart-checkout]').click();
            await page.locator('#o-name').fill('TEST WEBKIT CHECKOUT');await page.locator('#o-email').fill('webkit@example.invalid');await page.locator('#o-phone').fill('09170000000');await page.locator('#o-address').fill('123 Test Street');
            await page.locator('#o-courier').selectOption('jt');
            await page.locator('#o-province option[value="METRO-MANILA"]').waitFor({state:'attached',timeout:15000});
            await page.locator('#o-province').selectOption('METRO-MANILA');
            await page.locator('#o-city option[value="QUEZON-CITY"]').waitFor({state:'attached'});
            await page.locator('#o-city').selectOption('QUEZON-CITY');
            await page.waitForTimeout(6000);
            const state=()=>page.evaluate(()=>({courier:document.querySelector('#o-courier').value,disabled:document.querySelector('form[data-api="/api/orders"] [type="submit"]').disabled,valid:document.querySelector('form[data-api="/api/orders"]').checkValidity(),invalid:[...document.querySelectorAll('form[data-api="/api/orders"] :invalid')].map(x=>x.name),note:document.querySelector('[data-cart-shipping-note]').textContent,quoteId:document.querySelector('[data-shipping-quote-id]').value.length}));
            console.log('WEBKIT_JT',JSON.stringify(await state()));
            await page.locator('#o-courier').selectOption('pickup');
            await page.waitForTimeout(2100);
            console.log('WEBKIT_PICKUP',JSON.stringify(await state()));
          }finally{await browser.close()}
          NODE
